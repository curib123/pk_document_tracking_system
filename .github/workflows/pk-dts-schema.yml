name: PK DTS QA
on:
  push:
    branches: [master, development, 'fix/**']
  pull_request:
    branches: [master, development]
permissions:
  contents: read
concurrency:
  group: pk-dts-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  modal_dismissal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify static backdrops, Escape protection and offline dismissal
        run: node --test tests/modal_dismissal.test.js

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli,mbstring,fileinfo,zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Composer dependency compatibility with PHP ${{ matrix.php }}
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
      - name: PHP and JavaScript syntax plus workflow plan contracts
        run: bash tests/run_unit.sh

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: pk_dts_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure MariaDB client
        run: |
          if ! command -v mariadb >/dev/null && ! command -v mysql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y mariadb-client
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring,fileinfo,zip
      - name: Verify clean schema, nine definitions, repeated seed and published version
        run: bash tests/smoke.sh
      - name: Workflow returns reverse one step and replay approval
        env:
          PK_TEST_DB: '1'
          DB_DATABASE: pk_dts_test
          DB_PASSWORD: rootpass
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php tests/request_return.php
          php tests/user_role_permissions.php --database
          php tests/user_role_assignments.php
          php tests/task_notifications.php
          php tests/controlled_file_replacement.php
      - name: Encrypted full backup and restore integration (disposable test database)
        run: bash tests/backup_integration.sh
