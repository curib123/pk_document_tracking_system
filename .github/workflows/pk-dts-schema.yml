name: PK DTS Schema CI
on:
  push:
    branches: ['feat/pk-dts-sql-master-rebuild']
  pull_request:
    branches: [master]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring,fileinfo,zip
      - run: php tests/lint.php
      - run: php tests/static_contract.php
      - run: node --check public/assets/js/app.js
  database:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: pk_dts_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring,fileinfo,zip
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: bash tests/smoke.sh
