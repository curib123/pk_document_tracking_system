name: PK DTS Schema CI
on:
  push:
    branches: ['feat/pk-dts-sql-master-rebuild']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  local-runtime:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Prepare disposable verification runtime packages
        run: |
          apt-get update -qq
          apt-get -y --download-only install php8.4-mysql php8.4-mbstring mariadb-server mariadb-client
          mkdir -p /tmp/pk-runtime
          cp /var/cache/apt/archives/*.deb /tmp/pk-runtime/
      - uses: actions/upload-artifact@v4
        with:
          name: pk-verification-runtime
          path: /tmp/pk-runtime/*.deb
          retention-days: 1
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact tested source without credentials or runtime data
        run: git archive --format=tar -o "$RUNNER_TEMP/pk-dts-source.tar" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pk-dts-source
          path: ${{ runner.temp }}/pk-dts-source.tar
          retention-days: 3
  login-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate full-cover centered login layout
        run: php tests/login_layout.php
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring,fileinfo,zip
      - run: php tests/lint.php
      - run: php tests/static_contract.php
      - run: node --check public/assets/js/app.js
  database:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: pk_dts_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring,fileinfo,zip
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/upload-artifact@v4
        with:
          name: pk-verification-vendor
          path: vendor/
          retention-days: 1
      - run: bash tests/smoke.sh
