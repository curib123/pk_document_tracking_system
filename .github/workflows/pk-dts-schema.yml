name: PK DTS Schema CI
on:
  push:
    branches: ['feat/pk-dts-sql-master-rebuild']
  pull_request:
    branches: [master]
jobs:
  login-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate full-cover centered login layout
        run: php tests/login_layout.php
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring,fileinfo,zip
      - run: php tests/lint.php
      - run: php tests/static_contract.php
      - run: php tests/ux_ui_contract.php
      - run: node --check public/assets/js/app.js
  database:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: pk_dts_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring,fileinfo,zip
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Make failing smoke route visible in logs
        run: |
          sed -i 's@  curl -fsS -b /tmp/pk-cookie -o /tmp/pk-module.html@  echo "Checking route: $route"; curl --fail-with-body -sS -b /tmp/pk-cookie -o /tmp/pk-module.html@' tests/smoke.sh
      - name: Check database-backed page routes
        run: |
          if ! bash tests/smoke.sh; then
            echo "Failed route response:"
            tail -c 1600 /tmp/pk-module.html || true
            echo
            exit 1
          fi
