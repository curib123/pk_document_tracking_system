name: Enterprise MVC UI
on:
  push:
    branches: ['feature/enterprise-mvc-ui']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint native MVC PHP and jQuery enhancement
        run: |
          find application/views/web application/modules/catalog application/modules/records application/core application/helpers -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check public/assets/js/enterprise-ui.js
          node --check public/assets/vendor/jquery/jquery-3.7.1.min.js
          node --check public/assets/vendor/bootstrap/bootstrap.bundle.min.js
      - name: Shared component and modular MVC checks
        run: |
          php tests/web_mvc.php
          php tests/modular_mvc.php
          php tests/enterprise_ui.php
