name: PK DTS Browser Verification Assets
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  browser-assets:
    if: github.head_ref == 'fix/plan-first-login-gate-20261009'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the application's existing pinned browser dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/pk-browser-assets"
          cd "$RUNNER_TEMP/pk-browser-assets"
          curl --fail --silent --show-error --retry 3 -L https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css -o bootstrap.min.css
          curl --fail --silent --show-error --retry 3 -L https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js -o bootstrap.bundle.min.js
          curl --fail --silent --show-error --retry 3 -L https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js -o chart.umd.min.js
          curl --fail --silent --show-error --retry 3 -L https://code.jquery.com/jquery-3.7.1.min.js -o jquery-3.7.1.min.js
          sha256sum * > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pk-browser-assets
          path: ${{ runner.temp }}/pk-browser-assets/
          retention-days: 1
