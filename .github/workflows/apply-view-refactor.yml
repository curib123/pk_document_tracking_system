name: Apply verified PHP view refactor
on:
  push:
    branches: [refactor/php-view-templates]
    paths: [.github/workflows/apply-view-refactor.yml, '.github/view-refactor/**']
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/refactor/php-view-templates'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli, mbstring, zip
          coverage: none
      - name: Apply checksummed source edits only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, lzma, subprocess
          root = Path.cwd()
          payload = b''.join((root / '.github/view-refactor' / ('part'+str(i)+'.xz')).read_bytes() for i in range(4))
          data = lzma.decompress(payload)
          assert hashlib.sha256(data).hexdigest() == '3f640eb2d9b69eadeccaa814b933cdb56e66b4c25f71bb26d53e6e3ff8e97911', 'Source payload changed'
          edits = json.loads(data)
          assert len(edits) == 64
          changes = []
          for entry in edits:
              name = entry['path']
              assert '..' not in Path(name).parts and not Path(name).is_absolute()
              assert name.startswith(('application/views/', 'public/assets/js/', 'docs/', 'tests/')) or name in ['.github/workflows/ci.yml', '.github/workflows/view-templates.yml', '.github/workflows/view-refactor-workspace.yml']
              path = root / name
              assert path.resolve().is_relative_to(root)
              before = path.read_text() if path.exists() else None
              digest = lambda text: hashlib.sha256(text.encode()).hexdigest() if text is not None else None
              assert digest(before) == entry['before'], 'Concurrent change: ' + name
              if entry['after'] is None:
                  after = None
              elif 'content' in entry:
                  after = entry['content']
              else:
                  lines = before.splitlines(True)
                  for start, end, replacement in reversed(entry['edits']):
                      lines[start:end] = [replacement]
                  after = ''.join(lines)
              assert digest(after) == entry['after'], 'Incorrect edit: ' + name
              if after is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(after)
              print('Verified', name)
              if not name.startswith('.github/'):
                  changes.append(name)
          subprocess.run(['python3', 'tests/view_architecture.py'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *changes], check=True)
          # Workflow changes are committed separately through the connected API.
          # This token only commits the verified application/view/test source files.
          PY
      - name: Check template and controller syntax
        run: |
          find application/views -name '*.php' -print0 | xargs -0 -n1 php -l
          for file in public/assets/js/*.js; do node --check "$file"; done
      - name: Commit to the isolated branch without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: move frontend HTML and SVG into PHP pages and components'
          git push origin HEAD:refactor/php-view-templates
          git rev-parse HEAD
