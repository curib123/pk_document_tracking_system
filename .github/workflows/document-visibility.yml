name: Document visibility verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: document-visibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: pk_visibility_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pk_visibility_test
      DB_USERNAME: root
      DB_PASSWORD: integration-only
      PK_TEST_DB: '1'
      PK_ADMIN_PASSWORD: Visibility-test-only-123!
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli, fileinfo, mbstring, zip
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - name: Verify clean database layout
        run: php tests/database_layout.php
      - name: Install isolated test database
        run: php database/install.php > /tmp/visibility-install.log
      - name: Document visibility regression tests
        run: |
          php tests/document_visibility.php
          php tests/request_discovery.php
      - name: Existing domain and MySQL regression tests
        run: |
          php tests/run.php
          php tests/architecture.php
          php tests/mysqli_contract.php
          php tests/native_database.php
          php tests/integration.php
          php tests/mysqli_integration.php
          php tests/concurrency.php
      - name: Existing-database permission upgrade
        run: php tests/document_visibility_sync.php
