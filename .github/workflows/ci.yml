name: Functional verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pk-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: pk_dts_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pk_dts_test
      DB_USERNAME: root
      DB_PASSWORD: integration-only
      PK_TEST_DB: '1'
      CI_ROUTE_PASSWORD: Native-route-test-only-2026!
      PK_ADMIN_PASSWORD: Initial-integration-only-123!
      APP_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli, fileinfo, mbstring, zip
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - name: Verify compiled design system
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:css
          node --test tests/reference_data.test.mjs
          php tests/styling.php
          php tests/frontend_assets.php
      - name: Syntax and domain rules
        run: |
          find application public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
          for file in public/assets/js/*.js; do node --check "$file"; done
          php tests/run.php
          php tests/architecture.php
          php tests/mysqli_contract.php
          php tests/native_database.php
      - name: Install empty test database
        run: |
          php bin/install.php > /tmp/install.log
          php bin/migrate.php
      - name: Domain and concurrency integration
        run: |
          php tests/request_catalog.php
          php tests/integration.php
          php tests/mysqli_integration.php
          php tests/concurrency.php
      - name: Native controller integration
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break || sleep 1; done
          python3 tests/native_routes.py
      - name: Native and styled modal UI contracts
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          export CHROMIUM_PATH=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1)
          python3 tests/modal_browser.py
          python3 tests/styling_browser.py
          python3 tests/native_browser.py
          python3 tests/reference_browser.py
          python3 tests/frontend_assets_browser.py
      - name: Private diagnostic logs on failure
        if: failure()
        run: |
          test ! -f /tmp/php-server.log || tail -80 /tmp/php-server.log
          test ! -d storage/logs || find storage/logs -type f -name '*.log' -exec tail -50 {} \;
