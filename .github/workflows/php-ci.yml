name: PHP checks
on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [master]
jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP
        run: php tests/lint.php
      - name: Verify architecture and routes
        run: php tests/static_contract.php
