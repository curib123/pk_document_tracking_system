name: PHP checks
on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [master]
jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP
        run: php tests/lint.php
      - name: Verify architecture and routes
        run: php tests/static_contract.php
  mysql-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: pk_dts_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, zip, fileinfo
      - name: Install framework
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run MySQL and HTTP smoke
        run: bash tests/integration_smoke.sh
