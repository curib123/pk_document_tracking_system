name: Frontend asset contract
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pk-assets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - run: php tests/frontend_assets.php
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: assets-test-only
          MYSQL_DATABASE: pk_frontend_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pk_frontend_test
      DB_USERNAME: root
      DB_PASSWORD: assets-test-only
      PK_TEST_DB: '1'
      CI_ROUTE_PASSWORD: Frontend-test-only-2026!
      PK_ADMIN_PASSWORD: Initial-frontend-test-only-2026!
      APP_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli, fileinfo, mbstring, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --prefer-dist --no-interaction
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:css
          php tests/frontend_assets.php
      - name: Prepare historical schema in disposable runner only
        run: |
          test "$PK_TEST_DB" = 1
          test "$DB_DATABASE" = pk_frontend_test
          # The user removed database/schema.sql in 75d24b9. Do not undo that
          # production change or import the unrelated workflow-history backup.
          # This known v7 DDL contains no company/user/document fixture records.
          if [ ! -f database/schema.sql ]; then
            git fetch --no-tags --depth=1 origin 1636d6ad9ae373b1030a8ad8ca66bfef36a72921
            git show 1636d6ad9ae373b1030a8ad8ca66bfef36a72921:database/schema.sql > /tmp/pk-assets-schema.sql
            test "$(git hash-object /tmp/pk-assets-schema.sql)" = 31cf8501b2b76cd4bd0f5a51959a3a956c302ec4
            mkdir -p database
            cp /tmp/pk-assets-schema.sql database/schema.sql
          fi
          php bin/install.php > /tmp/frontend-install.log
      - name: Start real test application
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/frontend-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break || sleep 1; done
          python3 tests/native_routes.py
      - name: Browser verification with real fonts and blocked-CDN fallback
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          export CHROMIUM_PATH=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1)
          python3 tests/frontend_assets_browser.py
      - name: Diagnostics from isolated test server
        if: failure()
        run: |
          test ! -f /tmp/frontend-install.log || tail -30 /tmp/frontend-install.log
          test ! -f /tmp/frontend-server.log || tail -60 /tmp/frontend-server.log
